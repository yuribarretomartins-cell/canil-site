 <!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="description"
      content="Canil Multi Raças em Imperatriz-MA. Filhotes de cães e gatos com atendimento humanizado, galeria de disponíveis, histórico de filhotes e atendimento para Maranhão, Pará e Tocantins."
    />

    <meta
      name="keywords"
      content="canil em Imperatriz, filhotes em Imperatriz, canil multi raças, Shih-tzu Imperatriz, Pinscher Imperatriz, Lulu da Pomerânia Imperatriz, filhotes Maranhão, canil Tocantins, canil Pará"
    />

    <meta name="author" content="Canil Multi Raças Imperatriz" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Canil Multi Raças Imperatriz | Filhotes em Imperatriz-MA</title>

    <script>
      (function () {
        function irParaDisponiveis() {
          if (window.location.hash === "#disponiveis") {
            window.location.replace("/disponiveis");
          }
        }

        irParaDisponiveis();

        window.addEventListener("hashchange", irParaDisponiveis);

        document.addEventListener(
          "click",
          function (event) {
            var elemento =
              event.target.closest &&
              event.target.closest("a[href='#disponiveis']");

            if (elemento) {
              event.preventDefault();
              window.location.href = "/disponiveis";
            }
          },
          true
        );
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
